name: Update Dataset

on:
  schedule:
    - cron: '0 21 * * *'  # Every day at 21h UTC (18h BRT)
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download data from previous run
        uses: actions/cache@v4
        with:
          path: |
            data/processed/dataset_historico.parquet
            models/*.pkl
          key: dataset-${{ github.ref }}
          restore-keys: dataset-

      - name: Update dataset
        run: python update_dataset.py
        env:
          TZ: America/Sao_Paulo

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/ models/
          timestamp=$(date -d '-3 hours' '+%d/%m/%Y %H:%M')
          git diff --cached --quiet || git commit -m "📊 Auto-update: ${timestamp} (BRT)"
          git push
